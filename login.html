<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign in to your Paw Haven account">

    <title>Owner Login | Paw Haven</title>
    <link rel="icon" type="image/png" href="images/paw-haven-logo.png">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"
        defer
    ></script>

    <!-- Main JavaScript -->
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script src="js/main.js" defer></script>
    <link rel="stylesheet" href="css/requested-refinements.css">
    <link rel="stylesheet" href="css/final-requested-refinements.css">
    <link rel="stylesheet" href="css/rtl-shared-layout.css?v=20261027-auth-corner-spheres-v4">
</head>

<body class="login-page">

    <main class="login-screen" data-aos="fade-in" data-aos-duration="700">

        <!-- Theme and RTL Controls -->
        <div class="login-tools" data-aos="fade-down" data-aos-duration="600">

            <button
                type="button"
                class="tool-button"
                data-theme-toggle
                aria-label="Switch to dark mode"
                title="Toggle theme"
            >
                <i data-lucide="moon" aria-hidden="true"></i>
            </button>

            <button
                type="button"
                class="tool-button"
                data-direction-toggle
                aria-label="Switch to right-to-left layout"
                title="Toggle text direction"
            >
                <i data-lucide="arrow-left-right" aria-hidden="true"></i>
            </button>

        </div>

        <!-- Login Card -->
        <section class="login-card" aria-labelledby="login-title" data-aos="fade-up" data-aos-duration="850">

            <!-- Paw Haven Logo and tagline -->
            <a href="index.html" class="brand" aria-label="Paw Haven home" data-aos="zoom-in" data-aos-duration="700">
                <img
                    src="images/paw-haven-logo.png"
                    alt="Paw Haven logo"
                    class="brand-logo"
                >
                <span class="login-brand-copy">
                    <span class="brand-name">
                        <span class="brand-first">Paw</span>
                        <span class="brand-second">Haven</span>
                    </span>
                    <small class="login-eyebrow">PET BOARDING &amp; DAYCARE</small>
                </span>
            </a>

            <!-- Heading -->
            <h1 id="login-title" data-aos="fade-up" data-aos-delay="120">Welcome Back</h1>

            <p class="login-description" data-aos="fade-up" data-aos-delay="160">
                Sign in to manage your bookings and stay connected
                with your furry friend.
            </p>

            <!-- Login Form -->
            <form id="owner-login-form" novalidate data-aos="fade-up" data-aos-delay="200">

                <!-- Email -->
                <div class="form-field">

                    <label for="login-email">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <i
                            data-lucide="mail"
                            class="input-icon"
                            aria-hidden="true"
                        ></i>

                        <input
                            type="email"
                            id="login-email"
                            name="email"
                            placeholder="Enter your email address"
                            autocomplete="email"
                            required
                        >

                    </div>

                    <small
                        class="field-error"
                        id="email-error"
                    ></small>

                </div>

                <!-- Password -->
                <div class="form-field">

                    <label for="login-password">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <i
                            data-lucide="lock-keyhole"
                            class="input-icon"
                            aria-hidden="true"
                        ></i>

                        <input
                            type="password"
                            id="login-password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-password-toggle="login-password"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            <i
                                data-lucide="eye"
                                aria-hidden="true"
                            ></i>
                        </button>

                    </div>

                    <small
                        class="field-error"
                        id="password-error"
                    ></small>

                </div>

                <!-- Remember Me and Forgot Password -->
                <div class="login-options">

                    <label class="remember-label">

                        <input
                            type="checkbox"
                            id="remember-me"
                            name="remember"
                        >

                        <span>Remember Me</span>

                    </label>

                    <a
                        href="forgot-password.html"
                        class="forgot-link"
                    >
                        Forgot Password?
                    </a>

                </div>

                <!-- Login Button -->
                <button type="submit" class="login-button">

                    <span>Log In</span>

                    <i
                        data-lucide="arrow-right"
                        aria-hidden="true"
                    ></i>

                </button>

                <!-- Form Status -->
                <p
                    class="form-status"
                    id="login-status"
                    role="status"
                    aria-live="polite"
                ></p>

            </form>

            <!-- Divider -->
            <div class="divider" data-aos="fade-in" data-aos-delay="100">

                <span></span>

                <p>or continue with</p>

                <span></span>

            </div>

            <!-- Social Login Buttons -->
            <div class="social-buttons" data-aos="fade-up" data-aos-delay="120">

                <!-- Google -->
                <button
                    type="button"
                    class="social-button"
                    data-social-login="Google"
                >

                    <svg
                        class="google-logo"
                        viewBox="0 0 48 48"
                        aria-hidden="true"
                    >
                        <path
                            fill="#4285F4"
                            d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.7c3.9-3.6 6-8.8 6-15Z"
                        />

                        <path
                            fill="#34A853"
                            d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.7-5.1c-1.8 1.2-4.1 2-6.8 2-5.2 0-9.6-3.5-11.2-8.2H5.9v5.3A20 20 0 0 0 24 44Z"
                        />

                        <path
                            fill="#FBBC05"
                            d="M12.8 27.8a12 12 0 0 1 0-7.6v-5.3H5.9a20 20 0 0 0 0 18.2l6.9-5.3Z"
                        />

                        <path
                            fill="#EA4335"
                            d="M24 12.1c3 0 5.7 1 7.8 3.1l5.9-5.9C34.1 5.9 29.5 4 24 4A20 20 0 0 0 5.9 14.9l6.9 5.3c1.6-4.7 6-8.1 11.2-8.1Z"
                        />
                    </svg>

                    <span>Google</span>

                </button>

                <!-- Apple -->
                <button
                    type="button"
                    class="social-button"
                    data-social-login="Apple"
                >

                    <svg class="apple-brand-logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.7 12.8c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.7.8-3.4.8-.7 0-1.8-.8-3-.8-1.6 0-3.1.9-4 2.3-1.7 2.9-.4 7.2 1.2 9.6.8 1.2 1.7 2.5 2.9 2.4 1.2 0 1.6-.8 3-.8s1.8.8 3 .8c1.3 0 2.1-1.2 2.8-2.4.9-1.3 1.2-2.6 1.2-2.7 0 0-2.3-.9-2.3-3.9ZM14.5 6.1c.6-.8 1-1.9.9-3.1-1 .1-2.2.7-2.9 1.5-.6.7-1.1 1.8-1 2.9 1.1.1 2.3-.5 3-1.3Z"/></svg>

                    <span>Apple</span>

                </button>

            </div>

            <!-- Signup Link -->
            <p class="signup-text" data-aos="fade-up" data-aos-delay="160">
                Don't have an account?
                <a href="signup.html">Create an account</a>
            </p>

        </section>

    </main>

</body>
</html>
