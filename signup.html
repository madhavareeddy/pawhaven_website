
<!DOCTYPE html>
<html lang="en" data-theme="light" data-direction="ltr" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your Paw Haven pet parent account.">

    <title>Create Account | Paw Haven</title>

    <link rel="icon" href="images/paw-haven-logo.png" type="image/png">

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/signup.css">

    <script src="https://unpkg.com/lucide@latest" defer></script>
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script src="js/main.js" defer></script>
    <script src="js/signup.js" defer></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/requested-refinements.css">
    <link rel="stylesheet" href="css/final-requested-refinements.css">
    <link rel="stylesheet" href="css/rtl-shared-layout.css?v=20261027-auth-corner-spheres-v4">
</head>

<body class="signup-page">
    <main class="signup-screen" data-aos="fade-in" data-aos-duration="700">

        <div class="signup-tools" data-aos="fade-down" data-aos-duration="600">
            <button
                class="signup-tool"
                type="button"
                data-theme-toggle
                aria-label="Switch to dark mode"
                title="Switch theme"
            >
                <i data-lucide="moon" data-theme-icon aria-hidden="true"></i>
            </button>

            <button
                class="signup-tool"
                type="button"
                data-direction-toggle
                aria-label="Switch to right-to-left layout"
                title="Change layout direction"
            >
                <i data-lucide="arrow-left-right" aria-hidden="true"></i>
            </button>
        </div>

        <section class="signup-card" aria-labelledby="signup-heading" data-aos="fade-up" data-aos-duration="850">

            <a class="signup-brand" data-aos="zoom-in" data-aos-duration="700" href="index.html" aria-label="Paw Haven home">
                <img
                    class="signup-logo"
                    src="images/paw-haven-logo.png"
                    alt="Paw Haven logo"
                >

                <span class="signup-brand-text">
                    <span class="signup-brand-name" dir="ltr">
                        <span class="brand-first">Paw</span>
                        <span class="brand-second">Haven</span>
                    </span>

                    <span class="signup-brand-tagline">
                        PET BOARDING &amp; DAYCARE
                    </span>
                </span>
            </a>

            <header class="signup-intro">
                <span class="signup-eyebrow">PET PARENT REGISTRATION</span>
                <h1 id="signup-heading">Join our pack.</h1>
                <p>
                    Create your account to manage your pet's bookings
                    and daily activity updates.
                </p>
            </header>

            <form id="owner-signup-form" novalidate>
                <div class="signup-form-grid">

                    <div class="signup-field">
                        <label for="signup-name">Full Name <span>*</span></label>
                        <div class="signup-input-wrap">
                            <i data-lucide="user-round" aria-hidden="true"></i>
                            <input
                                id="signup-name"
                                name="name"
                                type="text"
                                placeholder="Enter your full name"
                                autocomplete="name"
                                required
                            >
                        </div>
                        <small class="signup-error" id="name-error"></small>
                    </div>

                    <div class="signup-field">
                        <label for="signup-email">Email Address <span>*</span></label>
                        <div class="signup-input-wrap">
                            <i data-lucide="mail" aria-hidden="true"></i>
                            <input
                                id="signup-email"
                                name="email"
                                type="email"
                                placeholder="Enter your email"
                                autocomplete="email"
                                required
                            >
                        </div>
                        <small class="signup-error" id="email-error"></small>
                    </div>

                    <div class="signup-field">
                        <label for="signup-phone">Phone Number <span>*</span></label>
                        <div class="signup-input-wrap">
                            <i data-lucide="phone" aria-hidden="true"></i>
                            <input
                                id="signup-phone"
                                name="phone"
                                type="tel"
                                placeholder="Enter your phone number"
                                autocomplete="tel"
                                required
                            >
                        </div>
                        <small class="signup-error" id="phone-error"></small>
                    </div>

                    <div class="signup-field">
                        <label for="signup-role">I want to <span>*</span></label>
                        <div class="signup-input-wrap">
                            <i data-lucide="briefcase-business" aria-hidden="true"></i>
                            <select id="signup-role" name="role" required>
                                <option value="" selected disabled>
                                    Select account type
                                </option>
                                <option value="pet-parent">Pet Parent</option>
                                <option value="pet-care-provider">Pet Care Provider</option>
                            </select>
                        </div>
                        <small class="signup-error" id="role-error"></small>
                    </div>

                    <div class="signup-field">
                        <label for="signup-password">Password <span>*</span></label>
                        <div class="signup-input-wrap">
                            <i data-lucide="lock-keyhole" aria-hidden="true"></i>
                            <input
                                id="signup-password"
                                name="password"
                                type="password"
                                placeholder="Create password"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >
                            <button
                                class="signup-password-toggle"
                                type="button"
                                data-password-toggle="signup-password"
                                aria-label="Show password"
                                title="Show password"
                            >
                                <i data-lucide="eye" aria-hidden="true"></i>
                            </button>
                        </div>
                        <small class="signup-error" id="password-error"></small>
                    </div>

                    <div class="signup-field">
                        <label for="signup-confirm-password">
                            Confirm Password <span>*</span>
                        </label>
                        <div class="signup-input-wrap">
                            <i data-lucide="lock-keyhole" aria-hidden="true"></i>
                            <input
                                id="signup-confirm-password"
                                name="confirmPassword"
                                type="password"
                                placeholder="Confirm password"
                                autocomplete="new-password"
                                required
                            >
                            <button
                                class="signup-password-toggle"
                                type="button"
                                data-password-toggle="signup-confirm-password"
                                aria-label="Show password"
                                title="Show password"
                            >
                                <i data-lucide="eye" aria-hidden="true"></i>
                            </button>
                        </div>
                        <small class="signup-error" id="confirm-password-error"></small>
                    </div>

                </div>

                <div class="signup-terms">
                    <input id="signup-terms" name="terms" type="checkbox" required>
                    <label for="signup-terms">
                        I agree to the
                        <a href="contact.html">Terms and Conditions</a>
                        and
                        <a href="contact.html">Privacy Policy</a>.
                    </label>
                </div>

                <small class="signup-error signup-terms-error" id="terms-error"></small>

                <button class="signup-submit" type="submit">
                    <span>Create My Account</span>
                    <i data-lucide="arrow-right" aria-hidden="true"></i>
                </button>

                <p
                    class="signup-status"
                    id="signup-status"
                    role="status"
                    aria-live="polite"
                ></p>
            </form>

            <div class="signup-social-options" aria-label="Sign up with a provider">
                <button type="button" class="social-button" data-social-login="Google">
                    <svg class="google-logo" viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11a9.4 9.4 0 0 1-4.1 6.2v5.1h6.7c3.9-3.6 6-8.8 6-15Z"/><path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.9l-6.7-5.1c-1.8 1.2-4.1 2-6.8 2-5.2 0-9.6-3.5-11.2-8.2H5.9v5.3A20 20 0 0 0 24 44Z"/><path fill="#FBBC05" d="M12.8 27.8a12 12 0 0 1 0-7.6v-5.3H5.9a20 20 0 0 0 0 18.2l6.9-5.3Z"/><path fill="#EA4335" d="M24 12.1c3 0 5.7 1 7.8 3.1l5.9-5.9C34.1 5.9 29.5 4 24 4A20 20 0 0 0 5.9 14.9l6.9 5.3c1.6-4.7 6-8.1 11.2-8.1Z"/></svg>
                    <span>Google</span>
                </button>
                <button type="button" class="social-button" data-social-login="Apple"><svg class="apple-brand-logo" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.7 12.8c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.1-2.7.8-3.4.8-.7 0-1.8-.8-3-.8-1.6 0-3.1.9-4 2.3-1.7 2.9-.4 7.2 1.2 9.6.8 1.2 1.7 2.5 2.9 2.4 1.2 0 1.6-.8 3-.8s1.8.8 3 .8c1.3 0 2.1-1.2 2.8-2.4.9-1.3 1.2-2.6 1.2-2.7 0 0-2.3-.9-2.3-3.9ZM14.5 6.1c.6-.8 1-1.9.9-3.1-1 .1-2.2.7-2.9 1.5-.6.7-1.1 1.8-1 2.9 1.1.1 2.3-.5 3-1.3Z"/></svg><span>Apple</span></button>
            </div>

            <div class="signup-divider" data-aos="fade-in" data-aos-delay="100">
                <span></span>
                <p>Already registered?</p>
                <span></span>
            </div>

            <a class="signup-login-link" href="login.html" data-aos="fade-up" data-aos-delay="120">
                <i data-lucide="log-in" aria-hidden="true"></i>
                <span>Login to Existing Account</span>
            </a>

        </section>
    </main>
</body>
</html>
